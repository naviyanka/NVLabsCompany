version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://nexus:nexus@postgres:5432/nexus
      - REDIS_URL=redis://redis:6379/0
      - AUTH_ENABLED=true
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      - postgres
      - redis
    volumes:
      - ./src:/app/src
    command: uvicorn nexus.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXUS_API_URL=http://backend:8000
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
