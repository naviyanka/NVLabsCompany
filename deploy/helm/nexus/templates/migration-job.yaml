{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nexus.fullname" . }}-migration-{{ .Release.Revision }}
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": {{ .Values.migration.hook | default "pre-install,pre-upgrade" | quote }}
    "helm.sh/hook-delete-policy": {{ .Values.migration.hookDeletePolicy | default "before-hook-creation,hook-succeeded" | quote }}
    "helm.sh/hook-weight": "-5"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      name: {{ include "nexus.fullname" . }}-migration
      labels:
        {{- include "nexus.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "nexus.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: alembic-upgrade
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["python", "-m", "nexus.db_migrate"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Not the application Secret: the job holds only the migrator credential.
          envFrom:
            - configMapRef:
                name: {{ include "nexus.fullname" . }}-config
          env:
            - name: NEXUS_MIGRATION_ROLE
              value: {{ .Values.migration.user | quote }}
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "migration.existingSecret is required" .Values.migration.existingSecret | quote }}
                  key: {{ required "migration.secretKey is required" .Values.migration.secretKey | quote }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
{{- end }}
