apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus.fullname" . }}-frontend
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "nexus.selectorLabels" (dict "context" . "component" "frontend") | nindent 4 }}
