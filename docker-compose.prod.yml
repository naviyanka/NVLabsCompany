# Database roles: the schema is owned by nexus_migrator and the application runs as
# nexus_app, which owns nothing and so cannot drop triggers, disable row level security
# or alter policies. The BYPASSRLS nexus_system credential belongs to one internal process,
# system-runtime, and to nothing else. Four env files keep the credentials apart:
#   .env.postgres    bootstrap superuser, read only by the postgres service
#   .env.migration   MIGRATION_DATABASE_URL (nexus_migrator), read only by the migrate service
#   .env.production  DATABASE_URL (nexus_app), read by the api and worker. It must not hold
#                    SYSTEM_DATABASE_URL: both refuse to start if they find it.
#   .env.system      SYSTEM_DATABASE_URL (nexus_system) plus the application DATABASE_URL and
#                    REDIS_URL, read only by system-runtime, which publishes no port.
# Roles are provisioned once, by an administrator, before the first start. See
# docs/runbooks/database-roles.md and docs/runbooks/system-runtime.md. Nothing here creates
# roles or schema implicitly.
services:
  postgres:
    # pgvector is required by the migrations.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env.postgres
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-nexus_redis}"]
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nexus_redis}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  temporal:
    image: temporalio/auto-setup:1.24
    restart: unless-stopped
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-nexus}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-nexus_dev_password}
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7233 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  # One-shot schema migration as nexus_migrator. It refuses to run when the roles are not
  # provisioned as the runbook requires, and it never uses DATABASE_URL.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: "no"
    command: ["python", "-m", "nexus.db_migrate"]
    env_file:
      - .env.migration
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: ["python", "-m", "nexus.temporal.worker"]
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  # The only process that holds the BYPASSRLS system credential. No ports, no ingress. It
  # finds which companies need maintenance and publishes content-free work hints; company
  # data is only ever touched through nexus_app tenant sessions. It starts only after the
  # migration has finished.
  system-runtime:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: ["python", "-m", "nexus.system_runtime"]
    env_file:
      - .env.system
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "nexus.system_runtime", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

volumes:
  pgdata_prod:
  redisdata_prod:
