[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS - Autonomous AI Company Operating System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "NVLabs", email = "dev@nvlabs.company"},
]
dependencies = [
    "fastapi>=0.115.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    # Authentication. Brings pwdlib[argon2,bcrypt] for hashing and pyjwt for
    # token signing, replacing the previously declared (and unused)
    # python-jose and passlib. fastapi-users-db-sqlalchemy pins
    # sqlalchemy[asyncio]<2.1.0, which is the effective upper bound now.
    "fastapi-users[sqlalchemy]>=15.0.5",
    "jsonschema>=4.20.0",
    "temporalio>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
