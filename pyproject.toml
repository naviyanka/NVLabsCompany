[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS - Autonomous AI Company Operating System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "NVLabs", email = "dev@nvlabs.company"},
]
dependencies = [
    "fastapi>=0.115.0",
    # Upper bound: 0.0.45 maps datetime fields to a timezone-aware type that
    # rejects the naive-UTC values every column stores. Lift it only with a
    # deliberate timezone-aware migration (docs/CI_BASELINE.md).
    "sqlmodel>=0.0.39,<0.0.45",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    # pgvector column type + `<=>` distance operators for knowledge_chunks.
    "pgvector>=0.3.6",
    "alembic>=1.13.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    # Voice gateway client to the loopback worker (voice/worker_client.py); also arrives
    # via uvicorn[standard], declared because it is imported directly.
    "websockets>=13.0",
    # Authentication. Brings pwdlib[argon2,bcrypt] for hashing and pyjwt for
    # token signing, replacing the previously declared (and unused)
    # python-jose and passlib. fastapi-users-db-sqlalchemy pins
    # sqlalchemy[asyncio]<2.1.0, which is the effective upper bound now.
    "fastapi-users[sqlalchemy]>=15.0.5",
    # Run-token signing (auth/run_tokens.py). Declared directly rather than
    # relied on transitively through fastapi-users, and deliberately PyJWT
    # rather than python-jose: python-jose signs through the pure-Python
    # `ecdsa` package (CVE-2024-23342, non-constant-time), while PyJWT
    # delegates to `cryptography`, already a dependency below.
    "pyjwt>=2.8.0",
    # Fernet secret encryption at rest (governance/secret_backend.py,
    # api/routes/secrets.py). Previously only a transitive dependency.
    "cryptography>=42.0.0",
    "jsonschema>=4.20.0",
    # YAML frontmatter in agent role templates (templates/registry.py) and
    # Obsidian vault notes (obsidian/frontmatter.py). Previously relied on
    # transitively.
    "pyyaml>=6.0",
    "temporalio>=1.7.0",
    "prometheus-client>=0.20.0",
]

[project.scripts]
nexus = "nexus.cli:main"

[project.optional-dependencies]
# Distributed tracing. Optional on purpose: observability/tracing.py degrades
# to no-op spans when these are absent, so the base install stays lean.
otel = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]
dev = [
    "fakeredis>=2.26",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "testcontainers[postgres]>=4.8.0",
    # Pinned: scripts/ruff_baseline.json counts depend on the ruff version.
    "ruff==0.16.9",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "core_employee: fast employee chat/session/adapter/CLI checks (docs/testing/EMPLOYEE_CORE_TESTING.md)",
    "integration: exercises a real external service or several subsystems together",
    "slow: takes several seconds; deselect with -m \"not slow\"",
    "postgres: needs PostgreSQL (TEST_DATABASE_URL or testcontainers)",
    "real_cli: spawns an installed employee CLI; skipped unless NEXUS_REAL_CLI=1",
    "employee_work: task attempts, isolated worktrees, evidence and verification (nexus.runtime.task_attempts)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
