name: Enterprise Deployment & CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  # Weekly full build and scan, so a docs-only streak cannot hide drift in base images.
  schedule:
    - cron: '17 3 * * 1'
  # Manual run; always the full build. See docs/CI_SELECTIVE_BUILDS.md.
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Always true: a manual run performs the full multi-arch build and scan'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/nexus-api
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/nexus-frontend

jobs:
  # ============================================================================
  # 1. Static Analysis, Linting & Security Auditing
  # ============================================================================
  security-and-lint:
    name: Security & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # ruff is pinned because the ratchet baseline counts depend on its
      # version; keep it equal to the dev extra in pyproject.toml.
      - name: Install Linting & Security Tools
        run: |
          pip install ruff==0.16.9 mypy "bandit[toml]==1.9.4" safety

      # Existing violations are baselined per file and rule; any increase
      # fails. See scripts/ruff_ratchet.py and docs/CI_BASELINE.md.
      - name: Python Code Quality (Ruff ratchet)
        run: python scripts/ruff_ratchet.py

      - name: Python Security Audit (Bandit)
        run: bandit -r src/ -ll -q

      - name: Dockerfile Linting (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.prod
          failure-threshold: error

      - name: Frontend Dockerfile Linting
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: dashboard/Dockerfile.prod
          failure-threshold: error

  # ============================================================================
  # 2. Kubernetes Helm Chart Linting & Schema Validation
  # ============================================================================
  helm-validation:
    name: Helm Chart & Kubeconform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Helm v3
        uses: azure/setup-helm@v4.2.0
        with:
          version: 'v3.14.0'

      - name: Helm Lint
        # migration.existingSecret has no default on purpose: the chart refuses to render
        # without a credential for the migration job.
        run: helm lint deploy/helm/nexus --set migration.existingSecret=nexus-migration-db

      - name: Render Helm Templates
        run: |
          mkdir -p output
          helm template nexus deploy/helm/nexus --set migration.existingSecret=nexus-migration-db > output/manifests.yaml

      # yannh/kubeconform-action no longer exists. Install the pinned release
      # binary and verify it against the checksum published with v0.8.0.
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes Manifests with Kubeconform
        run: |
          kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            output/manifests.yaml

  # ============================================================================
  # 3. Multi-Architecture Container Build & Vulnerability Scan
  #
  # classify -> image-build (skipped for documentation-only PRs) -> build-and-scan.
  # build-and-scan is the required check: it always runs and decides pass/fail from
  # the results of the other two. A skipped image-build alone never satisfies it.
  # ============================================================================
  classify:
    name: Classify Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The classifier comes from the PR base, so a PR cannot loosen its own
      # classification; editing it is a non-documentation change anyway. No
      # classifier on the base (or any failure) means a full build.
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_FULL: ${{ inputs.force_full }}
        run: |
          script="$RUNNER_TEMP/ci_changes.py"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! git show "${BASE_SHA}:scripts/ci_changes.py" > "$script"; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "full build (no trusted classifier on the PR base)"
              exit 0
            fi
          else
            cp scripts/ci_changes.py "$script"
          fi
          python3 "$script" classify

  image-build:
    name: Multi-Arch Image Build (internal)
    needs: [classify, security-and-lint, helm-validation]
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # Successful runs take 12-14 minutes in total. A hung QEMU or BuildKit step
    # must fail the required check instead of running to the 6 hour default.
    timeout-minutes: 60
    env:
      BUILDKIT_PROGRESS: plain
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Architecture
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Extract Docker Metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      # Build & Scan Backend
      - name: Build Backend Image (Local single-arch for scan)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          load: true
          tags: nexus-api-scan:latest

      # The exact production image must import the Azure Entra SDK (a runtime
      # dependency, ADR 0006) and still ship the provider disabled. No network.
      - name: Import-smoke Azure provider runtime (Backend)
        run: |
          docker run --rm --network none nexus-api-scan:latest python -c "
          import aiohttp, azure.identity.aio
          from nexus.adapters import azure_openai_native as m
          assert m._identity_sdk()
          assert m.unavailable_reason().startswith('AZURE_OPENAI_DISABLED')
          print('azure runtime ok')
          "

      - name: Trivy Vulnerability Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nexus-api-scan:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Build & Push Backend Multi-Arch Image (amd64/arm64)
        uses: docker/build-push-action@v5
        timeout-minutes: 30
        with:
          context: .
          file: Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Scan Frontend
      - name: Build Frontend Image (Local single-arch for scan)
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: dashboard/Dockerfile.prod
          load: true
          tags: nexus-frontend-scan:latest

      - name: Trivy Vulnerability Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nexus-frontend-scan:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Build & Push Frontend Multi-Arch Image (amd64/arm64)
        uses: docker/build-push-action@v5
        timeout-minutes: 30
        with:
          context: ./dashboard
          file: dashboard/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # BuildKit's own log names the platform and stage that hung or crashed.
      - name: Build diagnostics
        if: failure() || cancelled()
        run: |
          docker buildx ls || true
          df -h / || true
          for c in $(docker ps -a --filter name=buildx_buildkit -q); do
            docker logs --tail 300 "$c" || true
          done

  build-and-scan:
    name: Multi-Arch Build & Vulnerability Scan
    needs: [classify, image-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Required gate
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          BUILD_RESULT: ${{ needs.image-build.result }}
        run: python3 scripts/ci_changes.py gate
