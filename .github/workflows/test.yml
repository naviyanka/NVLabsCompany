name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  arch-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/arch_guard.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev]"
        working-directory: .
      - run: pytest tests/ -x --tb=short -q
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          AUTH_ENABLED: "false"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npx tsc --noEmit
        working-directory: dashboard
      - run: npx vite build
        working-directory: dashboard

  # Mock and real API must answer list endpoints with the same shape. The same
  # spec runs twice: once against the mock Express server, once with
  # PROXY_API=true so every call is forwarded to FastAPI. A divergence on
  # either side fails here instead of surfacing as a blank page in production.
  api-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: npm ci
      - run: npm ci
        working-directory: dashboard
      - run: pip install -e ".[dev]"

      - name: Start mock dashboard server
        run: npx tsx server.ts &
        working-directory: dashboard
      - name: Wait for mock server
        run: |
          for i in $(seq 60); do
            curl -sf http://localhost:3000/api/v1/companies >/dev/null && exit 0
            sleep 1
          done
          echo "mock server never came up"; exit 1

      - name: Parity against the mock API
        run: npx playwright test e2e/api-parity.spec.ts --project=chromium

      - name: Stop mock dashboard server
        run: pkill -f "tsx server.ts" || true

      - name: Start backend
        run: uvicorn nexus.main:app --port 8000 &
        env:
          DATABASE_URL: sqlite+aiosqlite:///./parity.db
          AUTH_ENABLED: "false"
      - name: Wait for backend
        run: |
          for i in $(seq 90); do
            curl -sf http://localhost:8000/health/live >/dev/null && exit 0
            sleep 1
          done
          echo "backend never came up"; exit 1

      - name: Start dashboard in proxy mode
        run: npx tsx server.ts &
        working-directory: dashboard
        env:
          PROXY_API: "true"
          NEXUS_API_URL: http://localhost:8000
      - name: Wait for proxy
        run: |
          for i in $(seq 60); do
            curl -sf http://localhost:3000/api/v1/companies >/dev/null && exit 0
            sleep 1
          done
          echo "proxy never came up"; exit 1

      - name: Parity against the real API
        run: npx playwright test e2e/api-parity.spec.ts --project=chromium

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: api-parity-report
          path: playwright-report/
          retention-days: 7
